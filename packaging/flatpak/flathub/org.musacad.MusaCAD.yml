app-id: org.musacad.MusaCAD
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: musacad_app

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: musa-cad
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DMUSACAD_BUILD_DEV_TOOLS=OFF
    sources:
      - type: git
        url: https://github.com/MusaCAD/MusaCAD.git
        commit: 1a4384f0b8e983003a7516c7eb1313c9f6b4072e
        x-checker-data:
          type: git
          tag-pattern: "^v([\\d.]+)$"
