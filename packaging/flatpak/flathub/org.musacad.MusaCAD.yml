app-id: org.musacad.MusaCAD
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: musacad_app

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network

modules:
  - name: musa-cad
    buildsystem: cmake-ninja
    builddir: true
    no-parallel-make: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_FLAGS_RELEASE=-DNDEBUG
      - -DMUSACAD_BUILD_DEV_TOOLS=OFF
    sources:
      - type: git
        url: https://github.com/MusaCAD/MusaCAD.git
        tag: v0.6.0
        commit: ce7419e1f12f2ef72835f38fd5336569d58aed8a
        x-checker-data:
          type: git
          tag-pattern: "^v([\\d.]+)$"
