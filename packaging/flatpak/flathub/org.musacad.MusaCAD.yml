app-id: org.musacad.MusaCAD
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: musacad_app

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network

modules:
  - name: musa-cad
    buildsystem: cmake-ninja
    builddir: true
    no-parallel-make: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_FLAGS_RELEASE=-DNDEBUG
      - -DMUSACAD_BUILD_DEV_TOOLS=OFF
    sources:
      - type: git
        url: https://github.com/MusaCAD/MusaCAD.git
        tag: v0.8.0
        commit: 60606d7db4d54533a698ab08a924c6df1208a1da
        x-checker-data:
          type: git
          tag-pattern: "^v([\\d.]+)$"
