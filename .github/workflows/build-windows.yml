name: Build Windows installer

# Triggers: manual run, OR a pushed release tag (v*). Every `vX.Y.Z` tag therefore
# produces a Windows installer artifact automatically.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the installer filename (e.g. 0.1.0)"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # Svg ships in qtbase for Qt6; qtimageformats adds the rest. Keeps windeployqt
          # able to bundle the qsvg image plugin + qico.
          modules: "qtimageformats"
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install and verify NSIS
        shell: pwsh
        run: |
          $findNsis = {
            $candidates = @(
              "$env:ProgramFiles\NSIS\makensis.exe",
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            )
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($command) { $candidates += $command.Source }
            foreach ($candidate in $candidates) {
              if (Test-Path -LiteralPath $candidate -PathType Leaf) { return $candidate }
            }
            return $null
          }
          $nsis = & $findNsis
          for ($attempt = 1; -not $nsis -and $attempt -le 3; $attempt++) {
            try {
              choco install nsis -y --no-progress --limit-output
            } catch {
              Write-Warning "NSIS installation attempt $attempt failed: $_"
            }
            # Chocolatey can return success after a feed timeout without installing anything.
            $nsis = & $findNsis
            if (-not $nsis -and $attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $nsis) { throw "NSIS was not installed after three attempts." }
          & $nsis /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler verification failed." }
          "NSIS_EXE=$nsis" >> $env:GITHUB_ENV

      - name: Configure (Release, Ninja)
        shell: cmd
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=OFF -DENABLE_TSAN=OFF -DMUSACAD_MSVC_WERROR=ON

      - name: Build
        shell: cmd
        run: cmake --build build --target musacad_app musacad_launcher

      - name: Assemble + windeployqt
        shell: cmd
        run: |
          mkdir staging
          copy build\bin\musacad_app.exe staging\
          rem musacad.exe: the console front-end (waits for the app + returns its exit code,
          rem so --check / --plot work from cmd, PowerShell and scripts).
          copy build\bin\musacad.exe staging\
          windeployqt.exe --release --no-translations --compiler-runtime --include-plugins qoffscreen staging\musacad_app.exe
          rem windeployqt pulls in Qt DLLs + plugins (platforms\qwindows, imageformats\qsvg+qico,
          rem styles, iconengines). --compiler-runtime adds the MSVC redistributable DLLs.
          rem --include-plugins qoffscreen: `--plot` forces Qt's offscreen platform (docs/ARCHITECTURE.md)
          rem and windeployqt bundles only qwindows by itself -- without it the installed
          rem `musacad --plot` cannot start.

      - name: Package with NSIS
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          & $env:NSIS_EXE /NOCD "/DVERSION=$env:PACKAGE_VERSION" /DSTAGING=staging packaging\windows\musacad.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksum
        shell: bash
        # <installer>.sha256 in sha256sum's format, published beside the installer. The
        # in-place update inside Musa CAD refuses a download whose SHA-256 differs from it.
        run: |
          cd packaging/windows
          sha256sum MusaCAD-*-x86_64-setup.exe > "MusaCAD-${{ steps.ver.outputs.version }}-x86_64-setup.exe.sha256"
          cat *.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-${{ steps.ver.outputs.version }}-x86_64-setup
          path: |
            packaging/windows/MusaCAD-*-x86_64-setup.exe
            packaging/windows/MusaCAD-*-x86_64-setup.exe.sha256
          if-no-files-found: error

  # Tag pushes also publish: create the GitHub release for the tag (once -- whichever
  # platform's job gets there first creates it, the other attaches to it) and upload
  # the artifact and its checksum. Manual runs (workflow_dispatch) only build. The Flatpak
  # is still built locally and attached by hand (docs/RELEASING.md).
  publish:
    needs: windows-installer
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built artifact
        uses: actions/download-artifact@v4
        with:
          name: MusaCAD-${{ needs.windows-installer.outputs.version }}-x86_64-setup
          path: dist
      - name: Create the release if it does not exist, then attach the artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "Musa CAD $TAG" \
              --notes "Release notes: docs/release-notes/$TAG.md (see CHANGELOG.md)." \
              || true # the other platform's job may have just created it
          fi
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
