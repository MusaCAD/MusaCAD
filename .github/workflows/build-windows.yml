name: Build Windows installer

# Triggers: manual run, OR a pushed release tag (v*). Every `vX.Y.Z` tag therefore
# produces a Windows installer artifact automatically.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the installer filename (e.g. 0.1.0)"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # Svg ships in qtbase for Qt6; qtimageformats adds the rest. Keeps windeployqt
          # able to bundle the qsvg image plugin + qico.
          modules: "qtimageformats"
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Release, Ninja)
        shell: cmd
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=OFF -DENABLE_TSAN=OFF

      - name: Build
        shell: cmd
        run: cmake --build build --target musacad_app musacad_launcher

      - name: Assemble + windeployqt
        shell: cmd
        run: |
          mkdir staging
          copy build\bin\musacad_app.exe staging\
          rem musacad.exe: the console front-end (waits for the app + returns its exit code,
          rem so --check / --plot work from cmd, PowerShell and scripts).
          copy build\bin\musacad.exe staging\
          windeployqt.exe --release --no-translations --compiler-runtime --include-plugins qoffscreen staging\musacad_app.exe
          rem windeployqt pulls in Qt DLLs + plugins (platforms\qwindows, imageformats\qsvg+qico,
          rem styles, iconengines). --compiler-runtime adds the MSVC redistributable DLLs.
          rem --include-plugins qoffscreen: `--plot` forces Qt's offscreen platform (docs/CLI.md)
          rem and windeployqt bundles only qwindows by itself -- without it the installed
          rem `musacad --plot` cannot start.

      - name: Install NSIS
        shell: cmd
        run: choco install nsis -y --no-progress

      - name: Package with NSIS
        shell: cmd
        run: >
          "C:\Program Files (x86)\NSIS\makensis.exe" /NOCD
          /DVERSION=${{ steps.ver.outputs.version }}
          /DSTAGING=staging
          packaging\windows\musacad.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-${{ steps.ver.outputs.version }}-x86_64-setup
          path: packaging/windows/MusaCAD-*-x86_64-setup.exe
          if-no-files-found: error

  # Tag pushes also publish: create the GitHub release for the tag (once -- whichever
  # platform's job gets there first creates it, the other attaches to it) and upload
  # the artifact. Manual runs (workflow_dispatch) only build. The Flatpak is still built
  # locally and attached by hand (docs/RELEASING.md).
  publish:
    needs: windows-installer
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built artifact
        uses: actions/download-artifact@v4
        with:
          name: MusaCAD-${{ needs.windows-installer.outputs.version }}-x86_64-setup
          path: dist
      - name: Create the release if it does not exist, then attach the artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "Musa CAD $TAG" \
              --notes "Release notes: docs/release-notes/$TAG.md (see CHANGELOG.md)." \
              || true # the other platform's job may have just created it
          fi
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
