name: Build macOS app

# Same triggers as the Linux and Windows workflows: a manual run, or a pushed release tag
# (v*), which also publishes the .dmg to the GitHub release (issue #2). The bundle's command
# line (--check / --plot) is smoke-tested headless on the runner. The GUI viewport needs
# OpenGL 4.5 Core, which macOS does not provide (it stops at 4.1): on such a system the app
# says so at startup and explains what it needs, instead of opening a blank window. Signing
# and notarization run only when the secrets exist.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the bundle (e.g. 0.4.0)"
        required: false
        default: "0.4.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos-app:
    runs-on: macos-14 # Apple Silicon (arm64)
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: mac
          target: desktop
          arch: clang_64
          modules: "qtimageformats"
          cache: true

      - name: Install build tools
        run: brew install ninja librsvg

      - name: Configure (Release, Ninja)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=OFF -DENABLE_TSAN=OFF

      - name: Build
        run: cmake --build build --target musacad_app

      - name: Assemble MusaCAD.app + macdeployqt
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: packaging/macos/build_app.sh "$VERSION" build/bin/musacad_app

      - name: Smoke-test the bundle (headless --check and --plot)
        run: |
          APP=MusaCAD.app/Contents/MacOS/musacad_app
          QT_QPA_PLATFORM=offscreen "$APP" --check tests/fixtures/cli_demo.musa
          QT_QPA_PLATFORM=offscreen "$APP" --plot tests/fixtures/cli_demo.musa smoke.pdf
          test -s smoke.pdf && echo "plot ok: $(wc -c < smoke.pdf) bytes"

      - name: Sign and notarize (only when the secrets are configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$APPLE_ID" ]; then
            echo "No signing secrets: the bundle stays unsigned (right-click > Open to run it)."
            exit 0
          fi
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --deep --force --options runtime --timestamp \
            --sign "Developer ID Application" MusaCAD.app
          codesign --verify --deep --strict MusaCAD.app
          ditto -c -k --keepParent MusaCAD.app MusaCAD.zip
          xcrun notarytool submit MusaCAD.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple MusaCAD.app

      - name: Package the .dmg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          hdiutil create -volname "Musa CAD" -srcfolder MusaCAD.app -ov -format UDZO \
            "MusaCAD-$VERSION-arm64.dmg"
          ls -la MusaCAD-*.dmg

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-${{ steps.ver.outputs.version }}-arm64.dmg
          path: MusaCAD-*-arm64.dmg
          if-no-files-found: error

  # Tag pushes also publish, like the other platforms: create the release if no job has yet,
  # then attach the .dmg. Manual runs only build.
  publish:
    needs: macos-app
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built artifact
        uses: actions/download-artifact@v4
        with:
          name: MusaCAD-${{ needs.macos-app.outputs.version }}-arm64.dmg
          path: dist
      - name: Create the release if it does not exist, then attach the artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "Musa CAD $TAG" \
              --notes "Release notes: docs/release-notes/$TAG.md (see CHANGELOG.md)." \
              || true # another platform's job may have just created it
          fi
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
